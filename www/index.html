<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<title>Laz Lights</title>
<style>@font-face{font-family:"Tilt Neon";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/tilt-neon-latin.woff) format("woff")}</style>
<style>
:root{color-scheme:dark;--bg:#070814;--panel:rgba(22,24,56,.78);--panel2:#262a5c;--solid:#151735;--text:#eef0ff;--muted:#a3abda;--accent:#7b5cff;--accent2:#35d6ff;--good:#3ddc97;--warn:#ffd36b}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body{background:var(--bg)}
#sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:radial-gradient(ellipse at 15% 0%,#2b1a63 0%,transparent 55%),radial-gradient(ellipse at 95% 85%,#0b3b63 0%,transparent 50%),radial-gradient(ellipse at 60% 45%,#1a1240 0%,transparent 60%),var(--bg)}
.star{position:absolute;border-radius:50%;background:#fff;animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
#app{position:relative;z-index:1;max-width:440px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-block:12px 20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;cursor:pointer}
.top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.top>div{min-width:0}
.pill{background:var(--panel);border:1px solid #ffffff14;color:var(--text);border-radius:999px;padding:6px 10px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;backdrop-filter:blur(6px)}
.pill small{color:var(--muted);font-weight:500}
.btn{background:linear-gradient(135deg,var(--accent),#5a7bff);color:#fff;border:none;border-radius:12px;padding:12px 16px;font-weight:700;font-size:15px;box-shadow:0 4px 18px #7b5cff44}
.btn.alt{background:var(--panel2);box-shadow:none}
.btn.good{background:linear-gradient(135deg,#2bbf86,#25a3c9)}
.btn:disabled{opacity:.4;cursor:default}
h1{font-size:34px;margin:24px 0 2px;text-align:center;letter-spacing:1px;text-shadow:0 0 18px #7b5cffaa}
h1 span{color:var(--accent2);text-shadow:0 0 18px #35d6ffaa}
.tag{color:var(--muted);text-align:center;font-size:13px;margin-bottom:16px;line-height:1.45}
.daily{display:block;width:100%;margin-bottom:14px;background:linear-gradient(90deg,#ff7a59,#c45cff)}
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.lv{aspect-ratio:1;border-radius:50%;border:1px solid #ffffff1a;background:radial-gradient(circle at 35% 30%,#3a3f80,#151735);color:var(--text);font-weight:800;font-size:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;box-shadow:inset -4px -4px 10px #0007}
.lv.cur{background:radial-gradient(circle at 35% 30%,#a58cff,#4b2fd1);box-shadow:inset -4px -4px 10px #0006,0 0 18px #7b5cffcc}
.lv.lock{opacity:.3;cursor:default}
.lv .st{font-size:9px;color:var(--warn);letter-spacing:1px;min-height:11px}
.foot{margin-top:18px;display:flex;flex-direction:column;gap:8px}
.small{font-size:11px;color:var(--muted);text-align:center;line-height:1.5}
.hud{display:flex;gap:8px;margin:12px 0 8px}
.box{background:var(--panel);border:1px solid #ffffff14;border-radius:12px;padding:6px 10px;flex:1;text-align:center;backdrop-filter:blur(6px)}
.box .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.box .v{font-size:22px;font-weight:800}
.box .v.low{color:#ff6b7f}
.mission{background:var(--panel);border:1px solid #ffffff14;border-radius:14px;padding:7px 8px 8px;backdrop-filter:blur(6px);cursor:pointer}
.mission .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px;text-align:center}
.goals{display:flex;gap:6px}
.goal{flex:1;min-width:0;background:#ffffff0a;border-radius:10px;padding:6px 6px 7px;text-align:center}
.goal .gt{display:flex;align-items:center;justify-content:center;gap:6px;font-weight:800;font-size:15px}
.goal .nm{font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:5px;background:#ffffff1a;border-radius:3px;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .25s}
.goal.done{background:#3ddc9722;box-shadow:inset 0 0 0 1px #3ddc9766}
.goal.done .gt{color:var(--good)}
.goal.done .bar i{background:var(--good)}
.goal.bump{animation:bump .3s}
@keyframes bump{50%{transform:scale(1.08)}}
.brief-row{display:flex;align-items:center;gap:12px;font-size:15px}
.dot{width:18px;height:18px;border-radius:50%;display:inline-block;box-shadow:inset -3px -3px 5px #0007}
.rock-ic{width:18px;height:18px;display:inline-block;border-radius:42% 58% 50% 46%/50% 40% 60% 50%;background:linear-gradient(145deg,#a39cb0,#4a4656)}
#wrap{position:relative;width:100%;aspect-ratio:1;margin:10px 0 12px;touch-action:none}
#board{position:absolute;inset:0;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(7,1fr);border-radius:18px;border:1px solid #ffffff1a;
  background:radial-gradient(circle at 50% 35%,#1d2150ee,#0b0c22ee)}
#wrap.ham #board{box-shadow:0 0 0 3px var(--warn),0 0 24px #ffd36b66}
.cell{display:flex;align-items:center;justify-content:center}
.orb{position:relative;width:68%;height:68%;border-radius:50%;transition:transform .1s;box-shadow:inset -6px -7px 12px rgba(0,0,0,.55),0 0 12px var(--g)}
.orb.ring::after{content:"";position:absolute;left:-22%;right:-22%;top:40%;height:20%;border-radius:50%;border:2px solid rgba(255,236,190,.85);transform:rotate(-20deg)}
.orb.new{animation:drop .3s ease-out backwards}
.rock{width:72%;height:72%;border-radius:42% 58% 50% 46%/50% 40% 60% 50%;
  background:radial-gradient(circle at 30% 32%,#5d5968 0 11%,transparent 12%),radial-gradient(circle at 66% 62%,#55515f 0 9%,transparent 10%),radial-gradient(circle at 40% 72%,#615d6c 0 6%,transparent 7%),linear-gradient(145deg,#a39cb0,#4a4656);
  box-shadow:inset -5px -5px 10px #0007}
.cell.sel .orb{transform:scale(1.2);box-shadow:inset -6px -7px 12px rgba(0,0,0,.5),0 0 0 3px #ffffffaa,0 0 24px var(--g)}
@keyframes drop{from{transform:translateY(-45%) scale(.6);opacity:0}to{transform:none;opacity:1}}
#line{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.tools{display:flex;gap:8px}
.tools .btn{flex:1;font-size:14px;padding:10px 6px}
.tools .btn.on{box-shadow:0 0 0 3px var(--warn)}
.modal-bg{position:fixed;inset:0;background:#02030ccc;display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal{background:var(--solid);border:1px solid #ffffff1a;border-radius:18px;padding:20px;width:100%;max-width:380px;text-align:center;max-height:92vh;overflow:auto;box-shadow:0 10px 40px #000a,0 0 30px #7b5cff33}
.modal h2{margin:0 0 6px}
.modal p{color:var(--muted);margin:6px 0 14px;font-size:14px;line-height:1.45}
.row{display:flex;flex-direction:column;gap:8px}
.stars{font-size:36px;color:var(--warn);letter-spacing:6px;text-shadow:0 0 14px #ffd36b88}
.stars .off{color:#33366a;text-shadow:none}
.sec{font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);text-align:left;margin:14px 0 6px}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--panel2);border-radius:12px;padding:10px 12px;text-align:left}
.item small{color:var(--muted);display:block;font-size:12px}
.item .btn{padding:8px 12px;font-size:14px;flex-shrink:0}
.badge{background:#2bbf86;color:#fff;border-radius:6px;padding:1px 6px;font-size:11px;margin-left:4px}
.toast{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--panel2);border:1px solid #ffffff22;padding:10px 18px;border-radius:999px;font-weight:800;z-index:30;box-shadow:0 6px 20px #0008,0 0 18px #7b5cff55}
.say{display:flex;gap:10px;align-items:flex-start;text-align:left;margin:12px 0 2px}
.av{flex-shrink:0;display:inline-block;border-radius:50%;background:radial-gradient(circle at 50% 40%,#2e3370,#151735);border:1px solid #ffffff22;overflow:hidden;vertical-align:middle}
.av.evil{background:radial-gradient(circle,#3a1630,#150a1c);border-color:#ff6b7f55}
.av svg,.bport svg,.bigport svg{width:100%;height:100%;display:block}
.bubble{background:var(--panel2);border-radius:4px 14px 14px 14px;padding:8px 11px;font-size:14px;line-height:1.4;color:var(--text);min-width:0}
.bubble b{display:block;font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--accent2);margin-bottom:2px}
.bubble.evil{background:#3a1630;border-radius:14px}
.bubble.evil b{color:#ff8a9a}
.crew{display:flex;justify-content:center;gap:20px;margin:0 0 16px}
.cm{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted);font-weight:600}
.lv.boss{background:radial-gradient(circle at 35% 30%,#ff7a8a,#7a1430);box-shadow:inset -4px -4px 10px #0007,0 0 12px #ff3d5a66}
.lv.boss .st{color:#ffe0e4}
.mission.bossm{border-color:#ff6b7f55;background:linear-gradient(135deg,#3a1630cc,#1a0f2ecc)}
.mission.bossm .k{color:#ff8a9a}
.bossbar{display:flex;gap:10px;align-items:center}
.bport{width:60px;height:60px;flex-shrink:0;border-radius:14px;background:radial-gradient(circle,#3a1630,#150a1c);border:1px solid #ff6b7f55;overflow:hidden}
.bport.hit{animation:bhit .45s}
@keyframes bhit{20%{transform:translateX(-5px);filter:brightness(2.4) saturate(.2)}50%{transform:translateX(4px)}80%{transform:translateX(-2px)}}
.bport.atk{animation:batk .6s}
@keyframes batk{40%{transform:scale(1.25) rotate(-6deg);box-shadow:0 0 26px #ff5a6a}}
.binfo{flex:1;min-width:0;text-align:left}
.bname{font-weight:800;font-size:15px;color:#ffb0ba;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hp{position:relative;height:15px;background:#ffffff14;border-radius:8px;overflow:hidden;margin:4px 0}
.hp i{display:block;height:100%;background:linear-gradient(90deg,#ff3d5a,#ff9a5a);transition:width .35s}
.hp span{position:absolute;inset:0;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;text-shadow:0 1px 2px #000;font-variant-numeric:tabular-nums}
.bmeta{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.bigport{width:120px;height:120px;margin:6px auto 0;border-radius:26px;background:radial-gradient(circle,#4a1838,#150a1c);border:1px solid #ff6b7f66;overflow:hidden;box-shadow:0 0 30px #ff3d5a44;animation:hover 2.4s ease-in-out infinite}
@keyframes hover{50%{transform:translateY(-5px)}}
.ic{width:28px;flex-shrink:0;display:inline-flex;justify-content:center;font-size:20px}
.item small{font-weight:400}
.tabs{display:flex;gap:6px;background:#ffffff0d;border-radius:12px;padding:4px;margin:6px 0 8px}
.tab{flex:1;border:none;background:none;color:var(--muted);font:inherit;font-weight:700;padding:8px;border-radius:9px;cursor:pointer}
.tab.on{background:var(--accent);color:#fff}
.lbrow{display:flex;align-items:center;gap:10px;background:var(--panel2);border-radius:10px;padding:8px 12px;font-variant-numeric:tabular-nums}
.lbrow.me{box-shadow:inset 0 0 0 2px var(--accent2)}
.lbrow .rk{width:30px;font-weight:800;text-align:center;font-size:15px}
.lbrow .nm{flex:1;min-width:0;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbrow .sc{font-weight:800;color:var(--warn)}
.prize{display:flex;gap:10px;align-items:center;text-align:left;font-size:13px;padding:7px 12px;border-radius:10px;background:#ffd36b14;line-height:1.4}
.prize>b{font-size:22px}
.lbbtn{background:linear-gradient(135deg,#ffb340,#ff7a59)}
.item.eq{width:100%;border:none;color:var(--text);font:inherit;cursor:pointer}
.item.eq.on{background:#35d6ff1f;box-shadow:inset 0 0 0 2px var(--accent2)}
.item.eq:disabled{opacity:.4;cursor:default}
.item.eq>b{flex-shrink:0;color:var(--accent2)}
.actv{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.actv:empty{display:none}
.tag2{background:#7b5cff33;border:1px solid #7b5cff88;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
/* Neon logo */
.logo{position:relative;margin:22px auto 6px;text-align:center;cursor:pointer;padding:4px 0 2px;-webkit-tap-highlight-color:transparent}
.logo h1.neon{margin:0;font-family:"Tilt Neon","Segoe UI",system-ui,sans-serif;font-weight:400;font-size:clamp(38px,12vw,54px);line-height:1.05;
  letter-spacing:5px;display:flex;justify-content:center;flex-wrap:wrap;gap:0 16px;text-transform:uppercase;text-shadow:none}
.logo h1.neon span{position:relative;color:#fff;display:inline-block}
.logo h1.neon .w1{text-shadow:0 0 3px #fff,0 0 9px #ff8cff,0 0 20px #d05cff,0 0 40px #b04cff,0 0 72px #7b5cff;color:#f4c4ff}
.logo h1.neon .w2{text-shadow:0 0 3px #fff,0 0 9px #8cf6ff,0 0 20px #35d6ff,0 0 40px #20a8ff,0 0 72px #1c6fd1;color:#c4f6ff;animation:flicker 7s infinite}
@keyframes flicker{0%,17%,21%,24%,61%,64%,100%{opacity:1}18%,23%{opacity:.25;text-shadow:none}62%{opacity:.5}}
.logo h1.neon span::after{content:attr(data-text);position:absolute;left:0;top:0;width:100%;height:100%;color:transparent;text-shadow:none;
  background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.95) 50%,transparent 65%);background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;animation:sweep 4s ease-in-out infinite}
.logo h1.neon .w2::after{animation-delay:.35s}
@keyframes sweep{0%{background-position:120% 0}55%,100%{background-position:-20% 0}}
.logo svg.bolts{position:absolute;left:-8px;top:-16px;width:calc(100% + 16px);height:calc(100% + 32px);pointer-events:none;overflow:visible;z-index:2}
.logo .charge{position:relative;height:3px;width:72%;margin:12px auto 0;border-radius:2px;overflow:hidden;
  background:linear-gradient(90deg,transparent,#c45cff 25%,#35d6ff 75%,transparent);box-shadow:0 0 10px #35d6ff,0 0 20px #c45cff88}
.logo .charge::after{content:"";position:absolute;top:0;bottom:0;width:28%;background:linear-gradient(90deg,transparent,#fff,transparent);animation:charge 1.6s linear infinite}
@keyframes charge{from{left:-30%}to{left:102%}}
.logo.zap h1.neon span{animation:zapflash .4s}
/* Flash by brightening the text colour. A CSS filter here breaks the text-clipped shine on iPhone (WebKit) and draws boxes behind the words. */
@keyframes zapflash{25%{color:#fff}55%{color:#fffbff}}
.logo.zap h1.neon span::after{visibility:hidden}
/* Subtle electricity across the game */
@property --zap-a{syntax:"<angle>";inherits:false;initial-value:0deg}
#wrap::before{content:"";position:absolute;inset:-2px;border-radius:20px;padding:2px;pointer-events:none;z-index:1;
  background:conic-gradient(from var(--zap-a),transparent 0deg 290deg,#35d6ff 325deg,#ffffff 338deg,#c45cff 350deg,transparent 360deg);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;
  animation:zapRun 6s linear infinite,zapFade 6s ease-in-out infinite}
#wrap.bossw::before{background:conic-gradient(from var(--zap-a),transparent 0deg 290deg,#ff3d5a 325deg,#ffd0d6 338deg,#ff9a5a 350deg,transparent 360deg)}
@keyframes zapRun{to{--zap-a:360deg}}
@keyframes zapFade{0%,100%{opacity:0}18%,42%{opacity:.75}62%{opacity:0}}
#zaps{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:2}
.modal .row .btn:not(.alt):not(:disabled),.lbbtn,.daily{animation:btnZap 5.5s ease-in-out infinite}
@keyframes btnZap{0%,86%,100%{box-shadow:0 4px 18px #7b5cff44}88%{box-shadow:0 0 0 1px #bdf6ff,0 0 14px #35d6ffcc,0 4px 18px #7b5cff66}90%{box-shadow:0 4px 18px #7b5cff44}92%{box-shadow:0 0 0 1px #e9c8ff,0 0 12px #c45cffaa}}
.mission.bossm{animation:bossBuzz 3.4s infinite}
@keyframes bossBuzz{0%,82%,100%{box-shadow:none}84%{box-shadow:0 0 0 1px #ff5a6a99,0 0 16px #ff3d5a66}86%{box-shadow:none}88%{box-shadow:0 0 0 1px #ff5a6a66,0 0 10px #ff3d5a44}}
#sky::after{content:"";position:absolute;inset:0;opacity:0;background:radial-gradient(ellipse at var(--fx,70%) 12%,#9cc4ff30,transparent 55%)}
#sky.flash::after{animation:skyflash 1s ease-out}
@keyframes skyflash{0%{opacity:0}7%{opacity:1}13%{opacity:.15}21%{opacity:.8}100%{opacity:0}}
/* Flight School tutorial */
.hand{position:absolute;left:0;top:0;font-size:34px;line-height:1;transform:translate(-25%,-10%);pointer-events:none;z-index:4;opacity:0;filter:drop-shadow(0 3px 5px #000b)}
#wrap.tut .cell:not(.hint) .orb,#wrap.tut .cell:not(.hint) .rock{opacity:.28;filter:saturate(.5)}
#wrap.tut .cell.hint .orb,#wrap.tut .cell.hint .rock{animation:hintPulse 1.2s ease-in-out infinite}
@keyframes hintPulse{50%{transform:scale(1.12);box-shadow:inset -6px -7px 12px rgba(0,0,0,.5),0 0 0 3px #ffffffaa,0 0 26px var(--g,#ffffff)}}
.coach{margin-top:10px}
.coach .say{margin:0}
.tpulse{animation:tp 1.1s ease-in-out infinite}
@keyframes tp{50%{box-shadow:0 0 0 3px var(--warn),0 0 20px #ffd36b88}}
.tutbtn{background:linear-gradient(135deg,#2bbf86,#25a3c9)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}
.float{position:fixed;transform:translate(-50%,-50%);font-weight:900;font-size:22px;pointer-events:none;z-index:21;white-space:nowrap;
  text-shadow:0 0 12px currentColor,0 2px 0 #0009;animation:floatUp .9s ease-out forwards}
.float.big{font-size:38px;letter-spacing:2px;animation:floatBig 1.3s ease-out forwards}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}20%{opacity:1;transform:translate(-50%,-70%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-170%) scale(1)}}
@keyframes floatBig{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}70%{opacity:1;transform:translate(-50%,-60%) scale(1)}100%{opacity:0;transform:translate(-50%,-90%) scale(1.05)}}
#wrap.shake{animation:shake .45s}
@keyframes shake{20%{transform:translate(-7px,3px)}40%{transform:translate(6px,-4px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}
#wrap.warp #board{animation:warp .6s ease-in-out}
@keyframes warp{45%{transform:scale(.9) rotate(-5deg);filter:hue-rotate(70deg) blur(1.5px)}}
.modal{animation:popIn .32s cubic-bezier(.2,1.4,.4,1)}
@keyframes popIn{from{transform:scale(.85);opacity:0}}
.stars .sp{display:inline-block;animation:starIn .5s cubic-bezier(.2,1.7,.4,1) backwards}
@keyframes starIn{from{transform:scale(0) rotate(-120deg);opacity:0}}
.lv.cur{animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:inset -4px -4px 10px #0006,0 0 30px #7b5cffff}}
@media (prefers-reduced-motion:reduce){#wrap.tut .cell.hint .orb,#wrap.tut .cell.hint .rock,.tpulse{animation:none}#wrap::before{display:none}.modal .row .btn,.lbbtn,.daily,.mission.bossm,#sky.flash::after{animation:none}}
@media (prefers-reduced-motion:reduce){.logo h1.neon .w2,.logo h1.neon span::after,.logo .charge::after,.bigport,.bport.hit,.bport.atk,.star,.lv.cur,.modal,.stars .sp,#wrap.shake,#wrap.warp #board{animation:none}.orb.new{animation:none}}
/* planet symbols, chain readability */
.orb i,.dot i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:900;line-height:1;color:rgba(10,8,30,.58);text-shadow:0 1px 0 rgba(255,255,255,.35);pointer-events:none}
.orb i{font-size:clamp(12px,3.6vw,17px);z-index:2}
.dot{position:relative;vertical-align:middle}
.cell{position:relative}
.cell.end .orb{transform:scale(1.28);box-shadow:inset -6px -7px 12px rgba(0,0,0,.45),0 0 0 3px #fff,0 0 28px #fff}
.cell.npv::before{content:"";position:absolute;inset:6%;border-radius:50%;border:2px dashed #ffffffcc;animation:npv 1s linear infinite;pointer-events:none;z-index:2}
@keyframes npv{to{transform:rotate(360deg)}}
.cinfo{position:absolute;left:50%;top:-14px;transform:translateX(-50%);background:var(--panel2);border:1px solid #ffffff2a;border-radius:999px;padding:3px 12px;font-size:13px;font-weight:800;white-space:nowrap;z-index:5;pointer-events:none;opacity:0;transition:opacity .12s}
.cinfo.on{opacity:1}
.cinfo.nova{background:linear-gradient(90deg,#ff7a59,#c45cff);border-color:#fff8}
/* boss telegraphs */
.cell.tgt{background:#ff4a6a26;box-shadow:inset 0 0 0 1px #ff6b7f55}
.cell.hun .orb{outline:2px dashed #ff8a9acc;outline-offset:2px}
.cell.held .orb{filter:saturate(.5) brightness(.75)}
.cell.held::after{content:"";position:absolute;inset:4%;border-radius:50%;pointer-events:none;
  background:conic-gradient(from 20deg,transparent 0 10%,#b26bffdd 10% 17%,transparent 17% 35%,#b26bffdd 35% 42%,transparent 42% 60%,#b26bffdd 60% 67%,transparent 67% 85%,#b26bffdd 85% 92%,transparent 92%);
  -webkit-mask:radial-gradient(circle,transparent 50%,#000 53%);mask:radial-gradient(circle,transparent 50%,#000 53%)}
.btel{font-size:12px;color:#ffd0d7;margin-top:3px;line-height:1.35}
.btel b{color:#fff}
/* sectors, projects, journal */
.sector{position:relative;border-radius:16px;padding:12px 14px;margin:8px 0 12px;border:1px solid #ffffff22;background:linear-gradient(135deg,var(--e1),var(--e2));overflow:hidden;cursor:pointer;text-align:center}
.sector .sk{font-size:12px;letter-spacing:.7px;text-transform:uppercase;color:#ffffffcc;font-weight:700}
.sector .pname{font-weight:800;font-size:17px;margin-top:2px}
.sector .pmeta{font-size:13px;color:#fff;margin-top:6px}
.sector .bar{height:7px;background:#00000040}
.proj{width:170px;max-width:62%;margin:4px auto 0}
.proj svg{width:100%;height:auto;display:block;overflow:visible}
.proj .bp *{fill:none!important;stroke:#bcd6ffaa!important;stroke-width:1.3!important;stroke-dasharray:3 2}
.proj .ok{filter:drop-shadow(0 0 3px #ffffff66)}
.proj .new{animation:build 1.2s ease-out}
@keyframes build{0%{opacity:0;transform:translateY(-6px)}60%{opacity:1}100%{transform:none}}
.secrow{border-radius:14px;padding:8px 8px 10px;margin-bottom:10px;border:1px solid #ffffff14;
  background:linear-gradient(135deg,color-mix(in srgb,var(--e1) 55%,transparent),color-mix(in srgb,var(--e2) 45%,transparent))}
.secrow .sh{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;margin:0 4px 8px;gap:8px}
.secrow .sh small{color:#ffffffcc;font-weight:600;font-size:12px;white-space:nowrap}
.secrow.lock{opacity:.6}
.signal{display:flex;flex-direction:column;align-items:center;width:100%;margin-bottom:10px;background:linear-gradient(90deg,#1e9bd7,#7b5cff)}
.btn small{display:block;font-weight:600;font-size:12px;opacity:.92;margin-top:2px}
.wk{display:flex;justify-content:center;gap:6px;margin:8px 0}
.wk span{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:var(--panel2);color:var(--muted)}
.wk span.on{background:var(--good);color:#06291a}
.wk span.today{box-shadow:0 0 0 2px var(--accent2)}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--panel2);color:var(--muted);margin-bottom:4px}
.chip.challenge{background:#5a1f3a;color:#ffb3c2}
.chip.intro{background:#173f35;color:#9cf7bd}
.cgoals{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:8px 0}
.cgoals span{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px}
.rules{font-size:12px;color:var(--muted);text-align:left;background:#ffffff08;border-radius:10px;padding:8px 10px;margin:8px 0;line-height:1.45}
.rules b{color:var(--text)}
.story{background:linear-gradient(135deg,#2a1f6a,#14284f);border-radius:12px;padding:10px 12px;text-align:left;font-size:14px;line-height:1.45;margin:10px 0}
.story b{display:block;font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--accent2);margin-bottom:2px}
.next{font-size:13px;color:var(--text);background:#ffffff0d;border-radius:10px;padding:7px 10px;margin:8px 0;line-height:1.4}
.tiers{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0}
.tiers span{font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--panel2);color:var(--muted)}
.tiers span.on{background:linear-gradient(90deg,#ffb84d,#ff7ad0);color:#2a0b1f}
.jent{text-align:left;background:var(--panel2);border-radius:12px;padding:9px 12px;font-size:13px;line-height:1.45}
.jent b{display:block;font-size:13px}
.jent.locked{opacity:.45}
.stats{width:100%;border-collapse:collapse;margin:6px 0}
.stats td{padding:5px 6px;font-size:13px;text-align:left;border-bottom:1px solid #ffffff12}
.stats td+td{text-align:right;font-weight:700}
.linkbtn{background:none;border:none;color:var(--muted);text-decoration:underline;font-size:12px;padding:4px}
.lbbtn:disabled{animation:none}
.small{font-size:12px}
.goal .nm{font-size:12px}
.item small{font-size:13px}
@media (prefers-reduced-motion:reduce){.cell.npv::before,.proj .new{animation:none}}

/* ---------- level design: difficulty rises with the level number only ---------- */
function rng(seed) {
  return function () {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// Every sector of five follows the same rhythm: introduce → practice → combine → challenge → boss,
// and the next sector opens with a gentler recovery mission. New elements always arrive on the gentle mission.
const ROMAN = ["", "II", "III", "IV", "V", "VI"];
const MKIND = ["intro", "practice", "combine", "challenge"];
const MKIND_LABEL = { intro: "New sector · gentler mission", practice: "Practice", combine: "Combine", challenge: "Challenge mission", boss: "Boss battle" };
const MKIND_LOAD = [0.84, 0.95, 1.0, 1.08];
function levelCfg(n) {
  const r = rng(n * 9973);
  const colors = Math.min(6, 3 + Math.floor((n - 1) / 5));        // 3 → 6 planet types
  const moves = Math.max(16, 25 - Math.floor((n - 1) / 4));        // 25 → 16 moves
  const stones = n < 6 ? 0 : Math.min(12, 2 + Math.floor((n - 6) / 3)); // asteroids
  const perMove = { 3: 6, 4: 5, 5: 4.2, 6: 3.6 }[colors];          // rough tiles of one type per move
  const pressure = Math.min(0.72, 0.45 + n * 0.01);                // share of that ceiling the goals demand
  const nGoals = Math.min(3, 1 + Math.floor((n - 1) / 6));
  const pool = [...Array(colors).keys()];
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  if (n % 5 === 0) {
    // Boss battle: beat the boss's shields instead of collecting goals.
    const k = n / 5, B = BOSSES[(k - 1) % BOSSES.length], tier = Math.floor((k - 1) / BOSSES.length) + 1;
    const bm = moves + 2;
    const perAny = { 3: 28, 4: 24, 5: 18, 6: 14.5 }[colors];                 // measured damage per move from the test bot
    const hp = Math.round(bm * perAny * Math.min(0.95, Math.max(0.8, 0.68 + n * 0.007)));
    const rules = tier > 1 ? [B.rule, BOSSES[k % BOSSES.length].rule] : [B.rule];
    const boss = Object.assign({}, B, { tier, hp, weak: pool[0], rules,
      name: B.name + (tier > 1 ? " " + ROMAN[Math.min(tier - 1, 5)] : "") });
    return { n, colors, moves: bm, stones: Math.min(8, Math.max(0, stones - 1)), goals: [], boss, kind: "boss" };
  }
  const pos = (n - 1) % 5, kind = MKIND[pos];
  const total = Math.round(moves * perMove * pressure * MKIND_LOAD[pos]);
  const goals = pool.slice(0, nGoals).map(c => ({ c, need: Math.max(8, Math.round(total / nGoals)) }));
  const st = kind === "intro" && n > 6 ? Math.max(2, stones - 2) : stones;
  if (st) goals.push({ c: -1, need: st });

}

const rc = i => [Math.floor(i / N), i % N];
function neighbors(i, diag) {
  const [r, c] = rc(i), out = [];
  for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
    if (!dr && !dc) continue;
    if (!diag && dr && dc) continue;
    const rr = r + dr, cc = c + dc;
    if (rr >= 0 && rr < N && cc >= 0 && cc < N) out.push(rr * N + cc);
  }
  return out;
}
const isAdj = (a, b) => { const [r1, c1] = rc(a), [r2, c2] = rc(b); return a !== b && Math.abs(r1 - r2) <= 1 && Math.abs(c1 - c2) <= 1; };
// Seeded modes (Daily Signal, Ranked) draw every random number from G.rand, so everyone gets the same board and refills.
const rand = () => (G && G.rand ? G.rand() : Math.random());
const newOrb = () => ({ c: Math.floor(rand() * G.cfg.colors), fresh: true });
const linkable = i => !!G.board[i] && G.board[i].c >= 0 && !G.board[i].held;

function hasMove() {
  for (let i = 0; i < N * N; i++) {
    if (!linkable(i)) continue;
    for (const j of neighbors(i, true)) if (linkable(j) && G.board[j].c === G.board[i].c) return true;
  }
  return false;
}
function shuffleBoard() {
  const idx = G.board.map((t, i) => t.c >= 0 && !t.held ? i : -1).filter(i => i >= 0);
  for (let tries = 0; tries < 60; tries++) {
    const cols = idx.map(i => G.board[i].c);
    for (let k = cols.length - 1; k > 0; k--) { const j = Math.floor(rand() * (k + 1)); [cols[k], cols[j]] = [cols[j], cols[k]]; }
    idx.forEach((i, k) => G.board[i] = { c: cols[k], fresh: true });
    if (hasMove()) return;
  }
  idx.forEach(i => G.board[i] = newOrb());
  if (!hasMove()) shuffleBoard();
}
function buildBoard() {
  G.board = Array.from({ length: N * N }, newOrb);
  const spots = [];
  for (let i = 2 * N; i < N * N; i++) spots.push(i);
  for (let k = 0; k < G.cfg.stones && spots.length; k++) {
    const j = spots.splice(Math.floor(rand() * spots.length), 1)[0];
    G.board[j] = { c: -1, fresh: true };
  }
  if (!hasMove()) shuffleBoard();
}
// Boss telegraphs: what the boss will do at its next attack, shown on the board so the player can respond.
function bossPlan() {
  const b = G.cfg.boss, bs = G.bs;
  if (b.rules.includes("hungry")) {
    const cs = [...new Set(G.board.filter(t => t.c >= 0).map(t => t.c))];
    bs.hungry = cs[Math.floor(rand() * cs.length)]; bs.eaten = 0;
  }
  if (b.rules.includes("row")) { bs.row = 1 + Math.floor(rand() * 5); bs.jam = false; }
  if (b.rules.includes("flare")) bs.charge = 0;
}
function dropRocks(n, cells) {
  const pool = (cells || G.board.map((t, i) => i)).filter(i => G.board[i].c >= 0 && !G.board[i].held), hits = [];
  for (let k = 0; k < n && pool.length; k++) {
    const j = pool.splice(Math.floor(rand() * pool.length), 1)[0];
    G.board[j] = { c: -1, fresh: true }; hits.push(j);
  }
  return hits;
}
// The boss's turn: each rule either resolves in the player's favour (counter met) or attacks. A shield blocks the attacks only.
function bossTurn(blocked) {
  const b = G.cfg.boss, bs = G.bs, out = { hits: [], notes: [], dmg: 0, heal: 0, attacked: false };
  for (const r of b.rules) {
    if (r === "hungry") {
      if (bs.eaten >= HUNGER) { out.dmg += 15; out.notes.push("🍽️ " + b.name + " chokes! +15 damage"); }
      else if (!blocked) {
        // Gloop eats planets of the marked type and spits them back as asteroids.
        const marked = G.board.map((t, i) => t.c === bs.hungry && !t.held ? i : -1).filter(i => i >= 0);
        out.hits.push(...dropRocks(b.count, marked.length >= b.count ? marked : null)); out.attacked = true;
      }
    } else if (r === "row") {
      if (bs.jam) { out.dmg += 10; out.notes.push("🎯 Scrambler jammed! +10 damage"); }
      else if (!blocked) {
        const cells = [...Array(N).keys()].map(c => bs.row * N + c);
        cells.forEach(i => { if (G.board[i].c >= 0 && !G.board[i].held) G.board[i] = { c: Math.floor(rand() * G.cfg.colors), fresh: true }; });
        out.hits.push(...dropRocks(b.count, cells)); out.attacked = true;
      }
    } else if (r === "tentacle") {
      const held = G.board.filter(t => t.held).length;
      if (held) { out.heal += held * 5; out.notes.push("🦑 Tentacles feed: +" + held * 5 + " shields"); }
      if (!blocked) {
        const pool = G.board.map((t, i) => t.c >= 0 && !t.held ? i : -1).filter(i => i >= 0);
        for (let k = 0; k < b.count && pool.length; k++) {
          const j = pool.splice(Math.floor(rand() * pool.length), 1)[0];
          G.board[j].held = true; out.hits.push(j);
        }
        out.attacked = true;
      }
    } else if (r === "flare") {
      if (bs.charge >= FLARE) { out.dmg += 12; out.notes.push("☀️ Flare snuffed out! +12 damage"); }
      else if (!blocked) { shuffleBoard(); out.hits.push(...dropRocks(b.count)); out.attacked = true; }
    }
  }
  G.bossHp = Math.max(0, Math.min(b.hp, G.bossHp - out.dmg + out.heal));
  if (!hasMove()) shuffleBoard();
  bossPlan();
  return out;
}
function removeTiles(set, hitStones) {
  const all = new Set(set);
  let freed = 0;
  if (hitStones) set.forEach(i => neighbors(i, false).forEach(j => {
    const t = G.board[j];
    if (t.c === -1) all.add(j);
    else if (t.held && !set.has(j)) { t.held = false; freed++; }   // clearing beside a tentacle frees that planet
  }));
  all.forEach(i => { if (G.board[i].held) freed++; });
  G.lastRemoved = [...all].map(i => ({ i, c: G.board[i].c }));
  G.lastDamage = 0; G.lastFreed = freed;
  const mult = G.doubleLeft > 0 ? 2 : 1;   // Double Haul power-up
  if (G.cfg.boss && G.bossHp > 0) {
    G.lastDamage = (G.lastRemoved.reduce((s, t) => s + (t.c < 0 ? 3 : t.c === G.cfg.boss.weak ? 2 : 1), 0) + freed * 4) * mult;
    G.bossHp = Math.max(0, G.bossHp - G.lastDamage);
  }
  if (G.bs) G.lastRemoved.forEach(t => {
    if (t.c === G.bs.hungry) G.bs.eaten = (G.bs.eaten || 0) + 1;
    if (t.c < 0) G.bs.charge = (G.bs.charge || 0) + 1;
  });
  all.forEach(i => { const c = G.board[i].c; G.got[c] = (G.got[c] || 0) + mult; G.board[i] = null; });
  for (let c = 0; c < N; c++) {
    const col = [];
    for (let r = N - 1; r >= 0; r--) { const t = G.board[r * N + c]; if (t) col.push(t); }
    for (let r = N - 1, k = 0; r >= 0; r--, k++) G.board[r * N + c] = col[k] || newOrb();
  }
  if (!hasMove()) { shuffleBoard(); if (!G.sim) toast("No moves left: free warp"); }
  return all.size;
}

// Jagged lightning path between two points (midpoint displacement).
function jag(x1, y1, x2, y2, disp) {
  if (disp < 2.5) return [[x2, y2]];
  const mx = (x1 + x2) / 2 + (Math.random() - 0.5) * disp, my = (y1 + y2) / 2 + (Math.random() - 0.5) * disp;
  return jag(x1, y1, mx, my, disp / 2).concat(jag(mx, my, x2, y2, disp / 2));
}
function drawBolts(n, big) {
  const svg = document.getElementById("bolts");
  if (!svg) return false;
  const r = svg.getBoundingClientRect(), W = r.width, H = r.height;
  svg.setAttribute("viewBox", "0 0 " + W.toFixed(0) + " " + H.toFixed(0));
  const line = (pts, col, w) => {
    const p = pts.map(q => q[0].toFixed(1) + "," + q[1].toFixed(1)).join(" ");
    return '<polyline points="' + p + '" fill="none" stroke="' + col + '" stroke-width="' + w * 3.5 + '" opacity=".55" filter="url(#lzglow)" stroke-linejoin="round" stroke-linecap="round"/>' +
      '<polyline points="' + p + '" fill="none" stroke="#fff" stroke-width="' + w + '" stroke-linejoin="round" stroke-linecap="round"/>';
  };
  let html = '<defs><filter id="lzglow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter></defs>';
  for (let k = 0; k < n; k++) {
    const x1 = W * Math.random() * 0.3, x2 = W * (0.7 + Math.random() * 0.3);
    const y1 = H * (0.15 + Math.random() * 0.7), y2 = H * (0.15 + Math.random() * 0.7);
    const pts = [[x1, y1]].concat(jag(x1, y1, x2, y2, (x2 - x1) * 0.3));
    const col = Math.random() < 0.5 ? "#35d6ff" : "#d38cff";
    html += line(pts, col, big ? 2 : 1.4);
    if (Math.random() < 0.7) {   // a forked branch
      const s = pts[Math.floor(pts.length * (0.3 + Math.random() * 0.4))];
      const ex = s[0] + (Math.random() - 0.5) * W * 0.3, ey = Math.random() < 0.5 ? 0 : H;
      html += line([s].concat(jag(s[0], s[1], ex, ey, H * 0.4)), col, big ? 1.2 : 0.8);
    }
  }
  svg.innerHTML = html;
  return true;
}
function strike(big) {
  const logo = document.getElementById("logo");
  if (!logo || FX.reduce) return;
  logo.classList.remove("zap"); void logo.offsetWidth; logo.classList.add("zap");
  let frames = big ? 8 : 3 + Math.floor(Math.random() * 3);

    if (!drawBolts(big ? 3 : 1 + Math.floor(Math.random() * 2), big)) return;
    if (--frames > 0) setTimeout(frame, 50 + Math.random() * 45);
    else setTimeout(() => { const s = document.getElementById("bolts"); if (s) s.innerHTML = ""; }, 70);

  if (big) { SFX.zap(); buzz([15, 30, 15]); FX.ring(r.left + r.width / 2, r.top + r.height / 2, "#35d6ff", r.width * 0.6, 0.5, 20); }

function tutBoard(st) {
  const r = rng(77 + G.tutI * 13), b = [], hint = new Set(st.hint || []);
  for (let i = 0; i < N * N; i++) b.push({ c: Math.floor(r() * 3), fresh: true });
  if (st.kind === "chain") {
    st.hint.forEach(i => { b[i] = { c: st.color, fresh: true }; });
    // Keep the neighbours a different colour, so only the glowing chain matches.
    st.hint.forEach(i => neighbors(i, true).forEach(j => {
      if (!hint.has(j) && b[j].c === st.color) b[j] = { c: (st.color + 1 + (j % 2)) % 3, fresh: true };
    }));
  }
  (st.rocks || []).forEach(i => { b[i] = { c: -1, fresh: true }; });
  return b;
}
function coach(who, text, next) {
  const el = document.getElementById("coach");
  if (!el) return;
  el.innerHTML = say(who, text) + (next ? '<div class="row" style="margin-top:8px"><button class="btn" data-act="tutnext">Next ›</button></div>' : "");
}
// The pointing hand walks along the chain to show the move, then repeats.
function runHand() {
  const h = document.getElementById("hand");
  if (!h) return;
  clearTimeout(G.handT);
  if (!G.hint || !G.hint.size) { h.style.opacity = 0; return; }
  const pts = G.tut.hint;
  let k = 0;
  const place = (i, instant) => {
    const [x, y] = cellPt(i);
    h.style.transition = instant ? "none" : "left .32s ease, top .32s ease, opacity .2s";
    h.style.left = (x / N * 100) + "%"; h.style.top = (y / N * 100) + "%";
  };
  (function stepFn() {
    if (!G || !G.tut || !G.hint || !G.hint.size || !h.isConnected) return;
    if (k === 0) { place(pts[0], true); h.style.opacity = 1; }
    else if (k < pts.length) place(pts[k]);
    else { h.style.opacity = 0; k = 0; G.handT = setTimeout(stepFn, 800); return; }
    k++;
    G.handT = setTimeout(stepFn, k === 1 ? 450 : 380);
  })();
}

function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

  if (kind === 1) return Object.assign(base, { colors: 5, moves: 9, stones: 3, goals: [{ c: color, need: 15 }] });

// Replays a ranked run from its seed with the same engine the game uses. Returns its score, or -1 if any move is illegal.
function simScore(cfg, run) {
  let log;
  try { log = typeof run === "string" ? JSON.parse(run) : run; } catch (e) { return -1; }
  if (!Array.isArray(log) || log.length > cfg.moves + (cfg.comets || 0)) return -1;
  const saved = G;
  try {
    G = { cfg, sim: true, rand: rng(cfg.seed), moves: cfg.moves, score: 0, got: {}, turns: 0, novaAt: 0, doubleLeft: 0, freeComets: cfg.comets || 0, bossHp: 0 };
    buildBoard();
    for (const a of log) {
      if (!Array.isArray(a)) return -1;
      if (a[0] === "c") {
        const i = a[1];
        if (G.freeComets <= 0 || !Number.isInteger(i) || i < 0 || i >= N * N) return -1;
        G.freeComets--; removeTiles(new Set([i]), false); G.score += 10;
        continue;
      }
      if (G.moves <= 0 || a.length < 2) return -1;
      const c0 = G.board[a[0]] ? G.board[a[0]].c : -9;
      for (let k = 0; k < a.length; k++) {
        const i = a[k];
        if (!Number.isInteger(i) || i < 0 || i >= N * N || !linkable(i) || G.board[i].c !== c0 || a.indexOf(i) !== k || (k && !isAdj(a[k - 1], i))) return -1;
      }
      chainCore(a);
    }
    return G.score;
  } catch (e) { return -1; } finally { G = saved; }
}

/* ---------- after a loss: one specific, useful observation ---------- */
const goalHave = g => g.c === "nova" ? (G.novas || 0) : g.c === "score" ? G.score : (G.got[g.c] || 0);
function lossTip() {
  const c = G.cfg;
  if (c.boss) {
    const b = c.boss;
    if (!G.novas) return ["nova", "Supernovas deal 10 extra damage to " + b.name + ". Look for a 6-planet chain before spending moves on small links."];
    const r = b.rules[G.turns % b.rules.length];
    return ["zip", RULES[r].icon + " Counter it: " + RULES[r].counter.toLowerCase() + ". It also takes double damage from " + goalName(b.weak).toLowerCase() + "."];
  }
  const left = c.goals.filter(g => goalHave(g) < g.need);
  const rock = left.find(g => g.c === -1);
  if (rock) return ["zip", "You needed " + (rock.need - goalHave(rock)) + " more asteroids. Link planets that touch an asteroid's side: one chain can break several at once."];
  if (left.some(g => g.c === "nova")) return ["bloop", "Supernovas need 6 linked planets. Use small links to let a big cluster of one type build up first."];
  if ((G.longest || 0) < 4) return ["bloop", "Your longest chain was " + (G.longest || 0) + ". Try diagonal links: longer chains collect more for the same move."];
  const g = left.filter(x => x.c !== "score").sort((a, b) => (b.need - goalHave(b)) - (a.need - goalHave(a)))[0];
  if (g) return ["nova", "You were " + (g.need - goalHave(g)) + " " + goalName(g.c).toLowerCase() + " short. Link those first, and use other links to drop more of them in."];
  return FAIL_LINES[(c.n || 0) % FAIL_LINES.length];
}

// After a move on a boss level: show the damage, then let the boss strike back on its schedule.
function bossReact(canAttack) {
  const b = G.cfg.boss;
  if (G.lastDamage) {
    bossFx("hit"); SFX.bossHit();
    const el = document.getElementById("bport");
    if (el) { const r = el.getBoundingClientRect(); floatText(r.left + r.width / 2, r.top + r.height / 2, "-" + G.lastDamage, "#ff6b7f"); }
    if (G.lastFreed) toast("🦑 Freed " + G.lastFreed + " planet" + (G.lastFreed === 1 ? "" : "s") + ": +" + G.lastFreed * 4 + " damage");
  }
  if (!canAttack || G.bossHp <= 0 || G.moves <= 0 || G.turns % b.every !== 0) return;
  G.busy = true;
  const me = G;
  setTimeout(() => {
    if (G !== me || G.over || G.bossHp <= 0) { me.busy = false; return; }
    const blocked = G.shield;
    if (blocked) G.shield = false;           // Deflector Shield: blocks this one attack
    const out = bossTurn(blocked);
    G.busy = false; path = []; updateSel(); drawAll();
    out.notes.forEach(t => toast(t));
    if (out.dmg) { bossFx("hit"); SFX.bossHit(); }
    if (blocked) {
      toast("🛡️ Shield blocked the attack!"); SFX.warp(); buzz(15);
      boardZap([[3.5, -0.4, 1.2, -0.1], [3.5, -0.4, 5.8, -0.1]], "#35d6ff", 3);
      const r = document.getElementById("wrap").getBoundingClientRect();
      FX.ring(r.left + r.width / 2, r.top + r.height / 2, "#35d6ff", r.width * 0.6, 0.7, r.width * 0.3);
    }
    if (out.attacked) {
      bossFx("atk"); toast(b.taunt); SFX.bossAttack(); jolt("shake", 400); buzz([20, 30, 20]);
      out.hits.forEach(i => { const [x, y] = cellCenter(i); FX.ring(x, y, "#ff5a6a", 50, 0.5); FX.burst(x, y, "#c9c2d8", 12, 4); });
      boardZap(out.hits.map(i => [3.5, -0.4].concat(cellPt(i))), "#ff4a6a", 4);
    }
    if (goalsMet()) setTimeout(win, 350);
  }, 650);
}

function idxAt(x, y, strict) {
  const r = document.getElementById("board").getBoundingClientRect(), cs = r.width / N;
  const c = Math.floor((x - r.left) / cs), rr = Math.floor((y - r.top) / cs);
  if (c < 0 || c >= N || rr < 0 || rr >= N) return -1;
  if (strict && Math.hypot(x - (r.left + (c + .5) * cs), y - (r.top + (rr + .5) * cs)) > cs * 0.42) return -1;
  return rr * N + c;
}

// Shows the selected chain, its endpoint, a running count and a Supernova preview before release.
function updateSel() {
  document.querySelectorAll(".cell.sel,.cell.end,.cell.npv").forEach(e => e.classList.remove("sel", "end", "npv"));
  path.forEach((i, k) => { const e = cellEl(i); if (e) { e.classList.add("sel"); if (k === path.length - 1 && path.length > 1) e.classList.add("end"); } });
  const need = G ? (G.novaAt || 6) : 6, ready = path.length >= need;
  if (ready) neighbors(path[path.length - 1], true).forEach(j => { if (!path.includes(j) && G.board[j].c >= 0) { const e = cellEl(j); if (e) e.classList.add("npv"); } });
  const wrap = document.getElementById("wrap");
  let ci = document.getElementById("chainInfo");
  if (!ci && wrap) { ci = document.createElement("div"); ci.id = "chainInfo"; ci.className = "cinfo"; wrap.appendChild(ci); }
  if (ci) {
    ci.classList.toggle("on", path.length >= 2); ci.classList.toggle("nova", ready);
    if (path.length >= 2) ci.textContent = ready ? "💥 " + path.length + " linked · SUPERNOVA on release" : path.length + " linked" + (path.length >= 3 ? " · " + (need - path.length) + " more for 💥" : "");
  }
  const svg = document.getElementById("line");
  if (path.length < 2) { svg.innerHTML = ""; return; }
  const pts = path.map(i => { const [r, c] = rc(i); return (c + .5) + "," + (r + .5); }).join(" ");
  const col = COLORS[G.board[path[0]].c];
  svg.innerHTML =
    '<polyline points="' + pts + '" fill="none" stroke="' + col[2] + '" stroke-width="0.32" stroke-linecap="round" stroke-linejoin="round" opacity="0.3"/>' +
    '<polyline points="' + pts + '" fill="none" stroke="#ffffff" stroke-width="0.08" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>' + crackleLine();
}

/* ---------- board lightning (drawn in board units: 7 x 7) ---------- */
function zjag(x1, y1, x2, y2, disp, min) {
  if (disp < min) return [[x2, y2]];

}
const cellPt = i => { const [r, c] = rc(i); return [c + 0.5, r + 0.5]; };
function boardZap(lines, color, frames) {
  const svg = document.getElementById("zaps");

  let f = frames || 3;
  (function draw() {
    if (!svg.isConnected) return;
    svg.innerHTML = lines.map(([x1, y1, x2, y2]) => {
      const pts = [[x1, y1]].concat(zjag(x1, y1, x2, y2, Math.hypot(x2 - x1, y2 - y1) * 0.35, 0.12))
        .map(p => p[0].toFixed(2) + "," + p[1].toFixed(2)).join(" ");
      return '<polyline points="' + pts + '" fill="none" stroke="' + color + '" stroke-width="6" opacity=".45" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>' +
        '<polyline points="' + pts + '" fill="none" stroke="#fff" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>';
    }).join("");
    if (--f > 0) setTimeout(draw, 60 + Math.random() * 40);
    else setTimeout(() => { svg.innerHTML = ""; }, 80);
  })();
}
// A burst of forks from one cell (supernova, black hole).
function novaZap(i, color) {
  const [x, y] = cellPt(i), lines = [];
  for (let k = 0; k < 5; k++) {
    const a = Math.random() * Math.PI * 2, d = 1.6 + Math.random() * 1.8;
    lines.push([x, y, Math.max(0, Math.min(7, x + Math.cos(a) * d)), Math.max(0, Math.min(7, y + Math.sin(a) * d))]);

// A faint crackle that dances along the beam while you drag a chain.
function crackleLine() {

    }

        if (G && !G.over) drawTools();
        openShop(onClose);
      },
      pack: (b, el) => {
        const p = PACKS[+el.dataset.k];
        if (IAP.ready) {
          // The store shows its own confirmation sheet; coins arrive in the `approved` handler.
          const prod = window.CdvPurchase.store.get(p.id);
          const offer = prod && prod.getOffer();
          if (!offer) { toast("This pack isn't available right now"); return; }
          b.remove();
          offer.order().then(() => openShop(onClose));
          return;
        }
        // Inside the app, coins are only ever sold through the App Store: never fall back to the free demo store.
        if (NATIVE) { toast("The App Store isn't connected yet. Try again in a moment."); return; }
        modal("<h2>Confirm purchase</h2><p>Buy <b>" + p.coins + " coins</b> for <b>" + priceOf(p) +
          "</b>?<br>Demo: no real charge.</p><div class=\"row\"><button class=\"btn good\" data-act=\"yes\">Buy for " + priceOf(p) +
          '</button><button class="btn alt" data-act="no">Cancel</button></div>',
          { yes: c => { SFX.coin(); S.coins += p.coins; S.demoSpent += p.price; S.purchases++; save(); c.remove(); b.remove(); toast("+" + p.coins + " coins"); openShop(onClose); },
            no: c => c.remove() });
      },
    });
  function buy(b, fn, cost) {
    if (S.coins < cost) return;
    S.coins -= cost; fn(); save(); b.remove(); toast("Bought!"); SFX.coin(); refreshCoins(); openShop(onClose);
  }
  return bg;
}

/* ---------- app-level clicks ---------- */
app.addEventListener("click", e => {
  const a = e.target.closest("[data-act]");
  if (!a) return;
  if (a.dataset.act !== "sound" && a.dataset.act !== "logo") SFX.click();
  switch (a.dataset.act) {
    case "logo": strike(true); break;
    case "sound": {
      // Cycles: music + effects → effects only → everything off → back on.
      let msg;
      if (!SFX.muted && MUSIC.on) { MUSIC.set(false); msg = "Music off · effects on"; SFX.click(); }
      else if (!SFX.muted) { SFX.toggle(); msg = "All sound off"; }
      else { SFX.toggle(); MUSIC.set(true); msg = "Music and effects on"; }
      document.querySelectorAll('[data-act="sound"]').forEach(b => b.textContent = soundIcon());
      toast(msg);
      break;
    }
    case "shop": openShop(); break;
    case "daily": claimDaily(); break;
    case "boards": if (S.level > 5) openBoards("w"); break;
    case "signal": startSignal(); break;
    case "journal": openJournal(); break;
    case "stats": openStats(); break;
    case "brief": if (G && !G.over) showBriefing(); break;
    case "level": { const n = +a.dataset.n; if (n <= S.level) startLevel(n); break; }
    case "back":
      if (!G.used || G.over || G.cfg.tutorial || G.cfg.mode === "daily") { if (G) clearTimeout(G.handT); renderMap(); break; }
      if (G.cfg.mode === "ranked") {
        modal("<h2>End this run?</h2><p>Your score of " + G.score.toLocaleString() + " still counts for this attempt.</p><div class=\"row\">" +
          '<button class="btn alt" data-act="stay">Keep playing</button><button class="btn" data-act="leave">End run</button></div>',
          { stay: bg => bg.remove(), leave: bg => { bg.remove(); rankedEnd(); } });
        break;
      }
      modal("<h2>Abort mission?</h2><p>Leaving after you've started uses 1 life.</p><div class=\"row\">" +
        '<button class="btn alt" data-act="stay">Keep playing</button><button class="btn" data-act="leave">Leave (−1 ❤️)</button></div>',
        { stay: bg => bg.remove(), leave: bg => { bg.remove(); loseLife(); renderMap(); } });
      break;
    case "tutorial": startTutorial(true); break;
    case "tutnext": if (G && G.cfg.tutorial && G.tutI < TUT.length - 1) tutStep(G.tutI + 1); break;
    case "hammer":
      if (G.freeComets != null) { if (G.freeComets <= 0) break; }
      else if (S.boost.hammer <= 0 && !G.cfg.tutorial) { openShop(); break; }
      G.mode = G.mode === "hammer" ? null : "hammer"; drawTools();
      if (G.mode) toast("Tap a tile to send a comet");
      break;
    case "hole":
      if ((S.pu.hole || 0) <= 0) { openShop(); break; }
      G.mode = G.mode === "hole" ? null : "hole"; drawTools();
      if (G.mode) toast("Tap a planet to open a black hole");
      break;
    case "shuffle":
      if (S.boost.shuffle <= 0) { openShop(); break; }
      S.boost.shuffle--; save(); shuffleBoard(); drawAll();
      SFX.warp(); buzz(15); jolt("warp", 650);
      break;
  }
});

// New players start in Flight School; everyone else lands on the map.
dayMark("o"); save();
if (!S.tutorialSeen && !S.tutorialDone && S.level === 1 && !Object.keys(S.stars).length) startTutorial(false);
else renderMap();
</script>
